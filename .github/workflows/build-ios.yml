# Trasforma la web app Palestra in un'app per iPhone (.ipa).
# Parte da sola a ogni caricamento di file su GitHub, oppure a mano da Actions → "App iPhone" → Run workflow.
# Il risultato si scarica dalla pagina Releases del repository: file Palestra.ipa, da installare con Sideloadly.

name: App iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['LEGGIMI.md']

concurrency:
  group: app-iphone
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - name: Scarica i file del repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepara i file dell'app
        run: |
          mkdir www
          cp index.html manifest.json icon-*.png www/
          # Solo nell'app per iPhone: il backup si condivide col foglio di iOS e la fine del recupero vibra davvero
          cat > www/nativo.js <<'EOF'
          (function () {
            var C = window.Capacitor;
            if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
            var P = C.Plugins;
            navigator.vibrate = function () { try { P.Haptics.vibrate({ duration: 400 }); } catch (e) {} return true; };
            navigator.canShare = function (d) { return !!(d && d.files && d.files.length); };
            navigator.share = async function (d) {
              var f = d.files[0];
              var r = await P.Filesystem.writeFile({ path: f.name, data: await f.text(), directory: 'CACHE', encoding: 'utf8' });
              try { await P.Share.share({ title: d.title || f.name, files: [r.uri] }); }
              catch (e) { if (/cancel/i.test(String((e && e.message) || e))) throw new DOMException('Annullato', 'AbortError'); throw e; }
            };
          })();
          EOF
          perl -pi -e 's|<head>|<head><script src="nativo.js"></script>|' www/index.html
          grep -q 'nativo.js' www/index.html

      - name: Crea il progetto iPhone con Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "it.riccardo.palestra",
            "appName": "Palestra",
            "webDir": "www",
            "backgroundColor": "#000000",
            "ios": { "backgroundColor": "#000000", "contentInset": "never" }
          }
          EOF
          npm init -y > /dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/ios@8 @capacitor/share@8 @capacitor/filesystem@8 @capacitor/haptics@8
          npx cap add ios

      - name: Tema scuro, solo verticale
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIUserInterfaceStyle string Dark" $PLIST
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $PLIST
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $PLIST

      - name: Icona e schermata di avvio
        run: |
          for f in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
            sips -s format png -z 1024 1024 www/icon-512.png --out "$f"
          done
          sips -s format png -z 560 560 www/icon-512.png --out logo.png
          for f in ios/App/App/Assets.xcassets/Splash.imageset/*.png; do
            sips -p 2732 2732 --padColor 000000 logo.png --out "$f"
          done

      - name: Compila (senza firma, la firma la fa Sideloadly)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../Palestra.ipa Payload

      - name: Pubblica Palestra.ipa nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-iphone --yes --cleanup-tag || true
          gh release create app-iphone Palestra.ipa --title "App iPhone (build ${{ github.run_number }})" \
            --notes "Scarica Palestra.ipa e installala sull'iPhone con Sideloadly."
