<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Palestra</title>
<style>
:root{--accent:#ff9f0a;--move:#fa114f;--ex:#a6ff00;--wk:#1fd8ff;--ok:#30d158;--danger:#ff453a;--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--text:#fff;--text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.5);--fill:rgba(118,118,128,.24);--top:calc(env(safe-area-inset-top) + 58px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:var(--text);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
svg{display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea,select{-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums}

.glass{background:rgba(38,38,42,.56);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.24),inset 0 0 0 .5px rgba(255,255,255,.09),0 10px 34px rgba(0,0,0,.5)}

/* barra superiore */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--top);padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.topbar::before{content:"";position:absolute;inset:0 0 -18px;background:linear-gradient(#000 0%,rgba(0,0,0,.82) 50%,rgba(0,0,0,0));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent);opacity:0;transition:opacity .25s;z-index:-1;pointer-events:none}
.topbar.scrolled::before{opacity:1}
.tt{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;max-width:50vw;text-align:center}
.topbar.scrolled .tt{opacity:1}
.tl{justify-self:start;display:flex;gap:8px}.tr{justify-self:end;display:flex;gap:8px}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s}
.gbtn svg{width:22px;height:22px}
.gbtn.acc{color:var(--accent)}
.gbtn:active{transform:scale(.9)}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;min-height:100vh}
main.root{padding-top:calc(env(safe-area-inset-top) + 6px)}
main.push{padding-top:var(--top)}
.large{font-size:34px;font-weight:700;line-height:44px;letter-spacing:.012em;padding:0 20px 2px}
main.root .large{padding-right:124px}
.sub{font-size:15px;color:var(--text2);padding:0 20px 12px;text-transform:capitalize}
main.push .large+.sub,main.push .large{padding-bottom:10px}

/* card e liste */
.card{margin:0 16px 14px;background:var(--bg2);border-radius:20px;padding:16px;position:relative}
.card.tap{cursor:pointer}
.card.tap:active,.tile:active,.atile:active,.row:active,.gitem.tap:active{opacity:.65}
.clabel{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.sec{font-size:22px;font-weight:700;padding:24px 20px 12px;letter-spacing:.01em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec button{font-size:17px;font-weight:400;color:var(--accent)}
.list{margin:0 16px;background:var(--bg2);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;left:var(--sl,66px);right:0;top:0;height:.5px;background:var(--sep)}
.row .rt{flex:1;min-width:0}
.t1{font-size:16px}
.t2{font-size:14px;color:var(--text2);margin-top:1px}
.rv{text-align:right;flex:none}
.rv b{display:block;font-size:16px;font-weight:600}
.rv span{font-size:13px;color:var(--text2)}
.chev{color:var(--text3);flex:none}
.chev svg{width:16px;height:16px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:21px;background:var(--c,var(--fill));color:#000}
.ic svg{width:22px;height:22px}
.ic.pesi{--c:rgba(255,159,10,.18);color:var(--accent)}
.ic.em{background:rgba(255,255,255,.08)}
.hint{color:var(--text2);font-size:15px;text-align:center;padding:26px 32px;line-height:1.4}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 32px 10px}
.eicon{width:92px;height:92px;border-radius:24px;background:linear-gradient(140deg,#ffb340,#ff9f0a 50%,#e0730b);display:grid;place-items:center;color:#000;margin-bottom:20px;box-shadow:0 14px 30px rgba(255,159,10,.3)}
.eicon svg{width:48px;height:48px}
.empty h2{font-size:22px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--text2);font-size:15px;line-height:1.4;max-width:330px;margin-bottom:22px}
.cta{background:var(--accent);color:#000;border-radius:25px;height:50px;padding:0 26px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta svg{width:20px;height:20px}
.cta.block{display:flex;width:100%;margin-top:14px}
.cta:active,.pill:active{opacity:.7}
.pill{height:46px;border-radius:23px;background:var(--fill);color:var(--text);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-size:16px}
.pill.red{color:var(--danger)}
.pill svg{width:18px;height:18px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 0}

/* anelli */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{width:132px;height:132px;flex:none;transform:rotate(-90deg)}
.rleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.rleg div{line-height:1.15}
.rleg span{font-size:13px;color:var(--text2);display:block}
.rleg b{font-size:22px;font-weight:700}
.rleg small{font-size:14px;font-weight:600;color:var(--text2)}

/* allenamento proposto */
.hero{background:linear-gradient(155deg,#3d2606,var(--bg2) 62%);border:.5px solid rgba(255,159,10,.25)}
.hero h2{font-size:26px;font-weight:700;margin:2px 0 8px}
.exl{list-style:none}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:.5px solid var(--sep);font-size:15px}
.exl li span:last-child{color:var(--text2);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.chip{border-radius:18px;padding:9px 15px;font-weight:600;font-size:15px;background:var(--bg2)}
.chip.on{background:var(--accent);color:#000}
.agrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 16px}
.atile{background:var(--bg2);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;min-width:0}
.atile .e{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:rgba(166,255,0,.14)}
.atile .e svg{width:22px;height:22px;color:var(--ex)}
.atile span{max-width:100%}
.link{display:block;margin:12px auto 0;color:var(--accent);font-size:16px;font-weight:500}
.livecard{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,#10340a,#1c1c1e 70%);border:.5px solid rgba(166,255,0,.3)}
.livecard .t{font-size:30px;font-weight:700}
.livecard .rt{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ex);display:inline-block;margin-right:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* settimana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.wd .b{width:100%;max-width:26px;height:64px;border-radius:7px;background:var(--fill);position:relative;overflow:hidden}
.wd .b i{position:absolute;left:0;right:0;bottom:0;background:var(--move);border-radius:7px}
.wd.today{color:var(--text);font-weight:700}

/* allenamento in corso */
.wkhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wkhead h2{font-size:24px;font-weight:700}
.wkstats{display:flex;gap:16px;margin-top:10px;font-size:14px;color:var(--text2)}
.wkstats b{color:var(--text);font-size:20px;font-weight:700;display:block}
.date{background:var(--fill);border:0;color:var(--text);font:inherit;font-size:15px;border-radius:10px;padding:7px 10px;-webkit-appearance:none;appearance:none}
.ex h3{font-size:18px;font-weight:600}
.exmeta{font-size:14px;color:var(--text2);margin-top:2px}
.prev{font-size:14px;color:var(--accent);margin-top:6px}
.badge{background:var(--fill);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--text2);flex:none}
.ex.complete .badge{background:var(--ok);color:#002a0b}
.sets{margin:12px 0 10px}
.sethead,.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.sethead{font-size:12px;color:var(--text2);text-align:center;padding-bottom:4px}
.set{margin-bottom:7px}
.set input{width:100%;text-align:center;font:inherit;font-size:17px;font-weight:600;color:var(--text);background:var(--bg3);border:1px solid transparent;border-radius:12px;padding:10px 4px;outline:none;-webkit-appearance:none;appearance:none}
.set input:focus{border-color:var(--accent)}
.set .n{color:var(--text2);text-align:center;font-weight:600}
.check{height:46px;border-radius:12px;background:var(--bg3);color:var(--text3);display:grid;place-items:center}
.check svg{width:22px;height:22px}
.set.done .check{background:var(--ok);color:#002a0b}
.set.done input{background:rgba(48,209,88,.14);color:#b8f5c8}
.row2{display:flex;gap:8px}
.sbtn{height:36px;border-radius:18px;background:var(--fill);padding:0 14px;font-size:14px;font-weight:600}
.sbtn:disabled{opacity:.35}
textarea.note{width:100%;min-height:80px;border:0;border-radius:12px;background:var(--bg3);color:var(--text);font:inherit;font-size:15px;padding:12px;margin-top:10px;outline:none;resize:vertical}

/* editor schede */
.fr{display:flex;align-items:center;min-height:48px;padding:0 16px;position:relative;gap:12px}
.fr+.fr::before,.fr+.fgrid::before,.fgrid+.fr::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.fr label{width:110px;flex:none;font-size:16px}
.fr input,.fr select{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:16px;outline:none;padding:12px 0;-webkit-appearance:none;appearance:none}
.fr input::placeholder,textarea::placeholder{color:var(--text3)}
.fr .u{color:var(--text2);font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 16px 12px;position:relative}
.fgrid label{font-size:12px;color:var(--text2);display:flex;flex-direction:column;gap:4px}
.fgrid input{width:100%;background:var(--bg3);border:0;border-radius:10px;color:var(--text);font:inherit;font-size:16px;padding:9px 8px;text-align:center;outline:none}
.exhead{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 0 16px}
.exhead .clabel{font-size:12px}
.icb{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;flex:none}
.icb svg{width:16px;height:16px}
.icb.red{color:var(--danger)}
.icb:disabled{opacity:.3}
.ebox{margin:0 16px 12px;background:var(--bg2);border-radius:18px;overflow:hidden}
.ebox .fr input{font-size:17px;font-weight:600}

/* storico: calendario */
.cal{margin:0 16px 14px;background:var(--bg2);border-radius:20px;padding:12px 12px 14px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.calh b{font-size:17px;text-transform:capitalize}
.calh button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.calh button svg{width:18px;height:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg .wl{font-size:11px;color:var(--text2);font-weight:600;padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative;cursor:pointer}
.cd.out{visibility:hidden}
.cd.today{color:var(--accent);font-weight:700}
.cd.sel{background:var(--accent);color:#000;font-weight:700}
.cd .ds{display:flex;gap:2px;position:absolute;bottom:12%}
.cd .ds i{width:5px;height:5px;border-radius:50%}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 16px 14px}
.st{background:var(--bg2);border-radius:16px;padding:12px}
.st b{display:block;font-size:24px;font-weight:700;line-height:1.1}
.st span{font-size:12px;color:var(--text2)}
.mhead{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:18px 32px 8px}

/* dettaglio sessione */
.dhead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 20px 16px}
.dhead .ic{width:74px;height:74px;border-radius:22px;font-size:40px;margin-bottom:12px}
.dhead .ic svg{width:40px;height:40px}
.dhead h2{font-size:26px;font-weight:700}
.dhead p{font-size:15px;color:var(--text2);margin-top:3px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 16px 14px}
.tgrid .st b{font-size:26px}
.tgrid .st small{font-size:15px;color:var(--text2);font-weight:600}
.pr{display:inline-flex;align-items:center;gap:4px;background:rgba(255,214,10,.16);color:#ffd60a;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
.esito{font-weight:700}
.esito.V{color:var(--ok)}.esito.S{color:var(--danger)}.esito.P{color:var(--text2)}

/* progressi */
.seg{display:flex;margin:0 16px 16px;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);transition:background .2s}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12)}
select.sel{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--bg3);border:0;border-radius:12px;padding:11px 14px;outline:none;-webkit-appearance:none;appearance:none;margin-top:8px}
canvas{width:100%;height:210px;display:block;margin-top:14px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi div{background:var(--bg3);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;font-weight:700}
.kpi span{font-size:12px;color:var(--text2)}
.chart{position:relative;height:130px;margin-top:18px;padding-right:44px;display:flex;align-items:flex-end;gap:3px}
.chart::after{content:"";position:absolute;left:0;right:44px;bottom:0;height:1px;background:var(--sep)}
.gl{position:absolute;left:0;right:44px;height:0;border-top:1px solid var(--sep);pointer-events:none}
.gl span{position:absolute;left:calc(100% + 6px);transform:translateY(-55%);font-size:11px;color:var(--text2);white-space:nowrap}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;z-index:1}
.bar{width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--c,var(--accent))}
.chart.sel .col:not(.on) .bar{opacity:.3}
.xl{display:flex;gap:3px;padding-right:44px;margin-top:6px;height:14px}
.xl span{flex:1;min-width:0;display:flex;justify-content:center;font-size:11px;color:var(--text2);white-space:nowrap}
.caption{font-size:14px;color:var(--text2);margin-top:6px;min-height:19px}
.caption b{color:var(--text)}
.mg{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.trk{height:8px;border-radius:4px;background:var(--fill)}
.trk i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.mg .pc{text-align:right;color:var(--text2);font-size:14px}
.bignum{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.bignum small{font-size:20px;color:var(--text2);font-weight:600;margin-left:3px}

/* impostazioni */
.ghead{font-size:13px;color:var(--text2);text-transform:uppercase;padding:20px 36px 7px;letter-spacing:.02em}
.group{margin:0 16px;background:var(--bg2);border-radius:14px;overflow:hidden}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;position:relative;width:100%;text-align:left}
.gitem+.gitem::before,.group .fr+.gitem::before,.group .gitem+.fr::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.gitem .gv{color:var(--text2)}
.gitem.red{color:var(--danger);justify-content:center}
.gitem.acc{color:var(--accent)}
.gfoot{font-size:13px;color:var(--text2);padding:8px 36px 4px;line-height:1.4}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;transition:background .25s;flex:none;cursor:pointer}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sw:checked{background:#30d158}
.sw:checked::before{transform:translateX(20px)}
.ms{display:flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.ms button{padding:6px 11px;border-radius:7px;font-size:14px;font-weight:600}
.ms button.on{background:#636366}

/* barra in basso */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 14px calc(8px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.dock::before{content:"";position:absolute;left:0;right:0;top:-30px;bottom:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.92) 55%);z-index:-1}
.tabbar{pointer-events:auto;width:100%;max-width:520px;display:flex;padding:4px;border-radius:33px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:28px;font-size:10px;font-weight:600;position:relative;transition:background .2s,color .2s}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--accent);background:rgba(255,255,255,.1)}
.tabbar .dotc{position:absolute;top:7px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--ex)}
.timer{pointer-events:auto;width:100%;max-width:520px;border-radius:26px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.timer[hidden]{display:none}
.timer .tl2{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.timer #ttime{font-size:28px;font-weight:700;flex:1}
.timer button{height:38px;min-width:46px;border-radius:19px;background:var(--fill);font-weight:600;font-size:15px;display:grid;place-items:center;padding:0 10px}
.timer button svg{width:16px;height:16px}
.timer .tb{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .25s linear}
.timer.fine #ttime{color:var(--ok)}

/* attività in corso (schermo intero) */
.live{position:fixed;inset:0;z-index:50;transform:translateY(100%);transition:transform .5s cubic-bezier(.32,.72,0,1);background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--lc,#1d4a0c) 85%,#000),#000 75%);visibility:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 24px calc(env(safe-area-inset-bottom) + 28px)}
.live.open{transform:none;visibility:visible}
.live .lt{align-self:stretch;display:flex;justify-content:space-between}
.live .le{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:52px;margin-top:4vh}
.live h2{font-size:24px;font-weight:700;margin-top:14px}
.live .ls{font-size:15px;color:var(--text2);margin-top:2px}
.live .lclock{font-size:min(22vw,96px);font-weight:700;letter-spacing:-.02em;margin-top:5vh;color:var(--ex);line-height:1}
.live.paused .lclock{color:#fff;opacity:.55}
.live .lk{display:flex;gap:34px;margin-top:22px;text-align:center}
.live .lk b{display:block;font-size:30px;font-weight:700}
.live .lk span{font-size:13px;color:var(--text2)}
.live .lb{margin-top:auto;display:flex;gap:40px;align-items:center}
.lbtn{width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.lbtn svg{width:36px;height:36px}
.lbtn.pause{background:rgba(255,214,10,.22);color:#ffd60a}
.lbtn.stop{background:rgba(255,69,58,.22);color:var(--danger)}
.lbtn:active{transform:scale(.92)}
.lbl{font-size:13px;color:var(--text2);text-align:center;margin-top:8px}

/* fogli e moduli */
.sheetw{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheetw[hidden]{display:none}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:500px;padding:0 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);max-height:88vh;display:flex;flex-direction:column}
.sheetw.show .shbg{opacity:1}
.sheetw.show .sheet{transform:none}
.shg{border-radius:22px;overflow:hidden auto;background:rgba(44,44,48,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16)}
.shh{padding:14px 20px;border-bottom:.5px solid var(--sep);text-align:left}
.shh .t1{font-weight:600}
.shb{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:0 20px;font-size:17px;text-align:left}
.shb+.shb{border-top:.5px solid var(--sep)}
.shb svg{width:22px;height:22px;flex:none}
.shb .em{font-size:22px;width:28px;text-align:center}
.shb.red,.shb.red svg{color:var(--danger)}
.shb:active{background:var(--fill)}
.shc{margin-top:8px;width:100%;height:56px;border-radius:22px;background:rgba(44,44,48,.92);font-weight:600;font-size:17px;flex:none}
.modal{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;justify-content:flex-end}
.modal .mbg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.modal .mbox{position:relative;height:calc(100% - env(safe-area-inset-top) - 10px);background:#1c1c1e;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
.modal.show .mbg{opacity:1}.modal.show .mbox{transform:none}
.mnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;padding:0 6px;flex:none}
.mnav b{font-size:17px}
.mnav button{color:var(--accent);font-size:17px;padding:8px 12px;justify-self:start}
.mnav .done{font-weight:600;justify-self:end}
.mbody{flex:1;overflow-y:auto;padding:4px 0 60px}
.mtop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 8px;text-align:center}
.mtop .ic{width:64px;height:64px;border-radius:20px;font-size:34px}
.mtop b{font-size:20px}
.form{margin:14px 16px 0;background:#2c2c2e;border-radius:14px;overflow:hidden}
.form .fr input[type=date],.form .fr input[type=time]{text-align:left;min-height:24px}
.fr.area{display:block;padding:12px 16px}
.fr.area label{display:block;width:auto;margin-bottom:6px;color:var(--text2);font-size:13px;text-transform:uppercase}
.fr textarea{width:100%;min-height:90px;border:0;background:none;color:var(--text);font:inherit;font-size:15px;line-height:1.4;outline:none;resize:vertical}
.fseg{flex:1;display:flex;background:var(--fill);border-radius:9px;padding:2px;min-width:0}
.fseg button{flex:1;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fseg button.on{background:#636366}
.mprev{margin:16px 16px 0;padding:14px 16px;border-radius:14px;background:rgba(166,255,0,.1);color:var(--ex);font-size:15px;line-height:1.4}
.mprev b{font-size:20px}
.mfoot{font-size:13px;color:var(--text2);padding:8px 32px 0;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,10px);opacity:0;z-index:99;padding:11px 18px;border-radius:22px;font-size:15px;font-weight:600;transition:opacity .3s,transform .3s;white-space:nowrap;pointer-events:none;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
input[type=file]{display:none}
</style>

  if (nonSp && confirm(`Ci sono ${nonSp} serie compilate ma non spuntate. Le segno come fatte?\n\n(Annulla = le salvo come non fatte)`)) w.esercizi.forEach(x => x.sets.forEach(t => { if (t.kg || t.reps) t.fatto = true; }));

  const fine = Date.now(), pr = [];
  for (const x of w.esercizi) {
    const mx = Math.max(-1, ...fatte(x).map(t => num(t.kg) ?? -1)); if (mx <= 0) continue;
    const k = x.nome.trim().toLowerCase(); let prevMax = null;
    for (const s of S.sessioni) if (s.tipo === 'pesi') for (const y of s.esercizi) if (y.nome.trim().toLowerCase() === k) for (const t of fatte(y)) { const v = num(t.kg); if (v != null && (prevMax == null || v > prevMax)) prevMax = v; }

  const sess = { id: w.id, ts: Date.now(), tipo: 'pesi', data: w.data || oggiISO(), inizio: w.inizio, fine, durata: Math.round((fine - w.inizio) / 1000), met: S.opz.metPesi, schedaId: w.schedaId, schedaNome: w.schedaNome, note: (w.note || '').trim(), pr,

  if (w.data !== oggiISO()) { const ini = dt(w.data, hhmm(w.inizio)); sess.inizio = ini; sess.fine = ini + sess.durata * 1000; }
  S.sessioni.push(sess); S.inCorso = null; save(); fermaTimer(); schermo();
  toast(pr.length ? `🎉 Nuovo record: ${pr.join(', ')}` : 'Allenamento salvato 💪');
  TABS.oggi.length = 1; TABS.storico.length = 1; TAB = 'storico'; push('sess', { id: sess.id });
  if (sess.durata > 3 * 3600) setTimeout(() => { if (confirm(`L'allenamento risulta lungo ${durTxt(sess.durata)}. Vuoi correggere gli orari?`)) modificaSess(sess.id); }, 600);
}

  schedaMenu: () => scegli(`<div class="t1">${esc(curScheda().nome)}</div>`, [
    { l: 'Inizia allenamento', i: 'play', f: () => { const s = curScheda(); if (s.esercizi.length) inizia(s.id); else toast('Aggiungi almeno un esercizio'); } },
    { l: 'Duplica scheda', i: 'copy', f: () => { const s = curScheda(), c = JSON.parse(JSON.stringify(s)); c.id = uid(); c.nome = s.nome + ' (copia)'; c.esercizi.forEach(e => e.id = uid()); S.schede.push(c); save(); TABS.schede.pop(); push('scheda', { id: c.id }); toast('Scheda duplicata'); } },
    { l: 'Elimina scheda', i: 'trash', red: true, f: () => { const s = curScheda(); if (!confirm(`Eliminare “${s.nome}”? Gli allenamenti già salvati restano nello storico.`)) return; S.schede = S.schede.filter(x => x !== s); save(); indietro(); } }
  ]),
  addEs() {
    curScheda().esercizi.push({ id: uid(), nome: '', serie: '3', reps: '10', kg: '', recupero: '90', note: '' }); save(); render(true);
    const ins = document.querySelectorAll('[data-e$=":nome"]'), last = ins[ins.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block: 'center' }); }
  },
  spostaEs(b) { sposta(curScheda().esercizi, +b.dataset.i, +b.dataset.d); save(); render(true); },
  delEs(b) { const s = curScheda(), e = s.esercizi[+b.dataset.i]; if (e.nome && !confirm(`Togliere “${e.nome}” dalla scheda?`)) return; s.esercizi.splice(+b.dataset.i, 1); save(); render(true); },
  inizia: b => inizia(b.dataset.id),
  spunta(b) {
    sbloccaAudio();
    const x = S.inCorso.esercizi[+b.dataset.i], j = +b.dataset.j, t = x.sets[j];
    t.fatto = !t.fatto;
    if (t.fatto) {
      if (!t.reps) { const r = parseInt(x.repsTarget, 10); if (isFinite(r)) t.reps = String(r); }
      const nx = x.sets[j + 1]; if (nx && !nx.fatto && !nx.kg && t.kg) { nx.kg = t.kg; if (!nx.reps) nx.reps = t.reps; }
      avviaTimer(x.recupero);
    }
    save(); render(true);
  },
  addSet(b) { const x = S.inCorso.esercizi[+b.dataset.i], l = x.sets[x.sets.length - 1]; x.sets.push({ kg: l ? l.kg : '', reps: l ? l.reps : '', fatto: false }); save(); render(true); },
  delSet(b) { const x = S.inCorso.esercizi[+b.dataset.i]; if (x.sets.length > 1) { x.sets.pop(); save(); render(true); } },
  termina: () => termina(),
  annulla() { if (confirm("Annullare l'allenamento? Quello che hai segnato andrà perso.")) { S.inCorso = null; save(); fermaTimer(); schermo(); render(); } },
  tadd(b) { T.end = Math.max(Date.now(), T.end) + (+b.dataset.d) * 1000; T.tot = Math.max(T.tot, Math.ceil((T.end - Date.now()) / 1000)); if (T.suonato) avviaTimer(Math.max(15, Math.ceil((T.end - Date.now()) / 1000))); else tickT(); },
  tstop: () => fermaTimer(),
  startAtt: b => avviaAttivita(b.dataset.att),
  altreAtt: async () => { const k = await scegliAttivita('Inizia un’attività'); if (k) avviaAttivita(k); },
  addAtt: () => aggiungiAttivita(),
  liveOpen: () => apriLive(),
  liveClose: () => chiudiLive(),
  livePause: () => pausaLive(),
  liveStop: () => stopLive(),
  editSess: () => modificaSess(pagina().id),
  delSess: () => { const s = S.sessioni.find(x => x.id === pagina().id); if (s && confirm(`Eliminare “${nomeSess(s)}” del ${fmtData(s.data)}?`)) { S.sessioni = S.sessioni.filter(x => x !== s); save(); indietro(); toast('Attività eliminata'); } },
  calMove: b => { const [y, m] = (CAL.m || oggiISO().slice(0, 7)).split('-').map(Number), d = new Date(y, m - 1 + +b.dataset.d, 1); CAL.m = isoOf(d).slice(0, 7); CAL.d = null; render(true); },
  calDay: b => { CAL.d = CAL.d === b.dataset.d ? null : b.dataset.d; render(true); },
  prgT: b => { PRG.t = b.dataset.t; render(true); },
  metric: b => { PRG.metric = b.dataset.m; render(true); },
  wm: b => { PRG.wm = b.dataset.m; render(true); },
  bar: b => { const i = +b.dataset.i, k = b.dataset.k; SEL[k] = SEL[k] === i ? null : i; render(true); },
  addPeso: () => modulo({ title: 'Peso', top: `<div class="ic" style="background:rgba(31,216,255,.16);color:var(--wk)">${I.scale}</div>`, groups: [[{ k: 'data', l: 'Data', type: 'date', v: oggiISO() }, { k: 'kg', l: 'Peso', type: 'dec', v: pesoAttuale() ?? '', u: 'kg' }]],
    onSave: v => { const kg = num(v.kg); if (!kg || kg < 20 || kg > 300 || !v.data) { toast('Inserisci un peso valido'); return false; } S.pesoLog = S.pesoLog.filter(p => p.data !== v.data); S.pesoLog.push({ data: v.data, kg }); S.profilo.peso = String(pesoAttuale()); save(); render(true); toast('Peso registrato'); } }),
  delPeso: b => { if (confirm('Eliminare questa misurazione?')) { S.pesoLog = S.pesoLog.filter(p => p.data !== b.dataset.d); save(); render(true); } },
  async esporta() {
    const name = `palestra-backup-${oggiISO()}.json`;
    const file = new File([JSON.stringify(Object.assign({}, S, { esportato: new Date().toISOString() }), null, 2)], name, { type: 'application/json' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup palestra' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  },
  importa: () => $('#imp').click(),
  reset() { if (!confirm('Cancellare TUTTE le schede, gli allenamenti e il profilo?')) return; if (!confirm('Sicuro? Senza un backup non si torna indietro.')) return; S = normalizza(null); save(); fermaTimer(); for (const k in TABS) TABS[k].length = 1; TAB = 'oggi'; render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.closest('.modal')) return;
  const f = AZ[b.dataset.act]; if (!f) return;
  e.stopPropagation(); f(b, e);
});
document.addEventListener('click', e => {
  const b = e.target.closest('.ms button'); if (!b) return;
  const k = b.parentElement.dataset.ms, v = b.dataset.v;
  if (k === 'sesso') S.profilo.sesso = v; else if (k === 'metPesi') S.opz.metPesi = num(v);
  save(); render(true);
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.s && S.inCorso) { const [i, j, k] = d.s.split(':'); S.inCorso.esercizi[i].sets[j][k] = t.value.trim(); save(); }
  else if (d.w && S.inCorso) { S.inCorso[d.w] = t.value; save(); }
  else if (d.sc && curScheda()) { curScheda().nome = t.value; save(); }
  else if (d.e && curScheda()) { const [i, k] = d.e.split(':'); curScheda().esercizi[i][k] = t.value; save(); }
  else if (d.p) { if (d.p === 'peso') { const kg = num(t.value); S.profilo.peso = t.value; if (kg && kg >= 20) { S.pesoLog = S.pesoLog.filter(p => p.data !== oggiISO()); S.pesoLog.push({ data: oggiISO(), kg }); } } else S.profilo[d.p] = t.value; save(); }
  else if (d.o) { const n = intOr(t.value, 0); if (n > 0) { S.obiettivi[d.o] = n; save(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selEs') { PRG.es = t.value; render(true); }
  if (t.dataset.sw) { S.opz[t.dataset.sw] = t.checked; save(); schermo(); }
  if (t.dataset.e && /:nome$/.test(t.dataset.e)) render(true);
  if (t.id === 'imp' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result); if (!Array.isArray(d.schede) || !Array.isArray(d.sessioni)) throw new Error();
        if (!confirm(`Il backup contiene ${d.schede.length} schede e ${d.sessioni.length} attività. Sostituire i dati attuali?`)) return;
        S = normalizza(d); save(); toast('Backup importato'); for (const k in TABS) TABS[k].length = 1; TAB = 'oggi'; render();
      } catch (err) { toast('File non valido'); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});

/* ============ Avvio ============ */
const setI = (sel, html) => { const el = document.querySelector(sel); if (el) el.innerHTML = html; };
setI('[data-tab="oggi"]', I.oggi + 'Oggi'); setI('[data-tab="schede"]', I.schede + 'Schede');
setI('[data-tab="storico"]', I.storico + 'Storico'); setI('[data-tab="progressi"]', I.progressi + 'Progressi');
setI('#tx', I.x); setI('#lClose', I.down); setI('#lStop', I.stop);
render(); schermo();
if (S.attivita) apriLive();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
